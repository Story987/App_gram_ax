name: 📝 Markdown Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'Ветка_Тест1'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 🔍 Конвертация .md в .html
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python markdown library
        run: pip install markdown

      - name: 🌐 Convert MD to HTML from Site folder
        run: |
          echo "🌐 Конвертируем .md файлы из папки Site..."
          mkdir -p html_output
          
          if [ ! -d "./Site" ]; then
            echo "❌ Папка Site не найдена!"
            exit 1
          fi
          
          cat > convert.py << 'EOF'
          import os
          import markdown
          from pathlib import Path

          input_dir = "Site"
          output_dir = "html_output"
          excluded_dirs = ["node_modules", ".git"]

          def safe_convert(md_path):
              try:
                  with open(md_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  html = markdown.markdown(content, extensions=['extra', 'toc'])
                  return html, True
              except Exception as e:
                  return f"<p><b>Ошибка конвертации:</b> {str(e)}</p>", False

          for root, dirs, files in os.walk(input_dir):
              dirs[:] = [d for d in dirs if d not in excluded_dirs]
              for file in files:
                  if file.endswith(".md"):
                      md_path = os.path.join(root, file)
                      rel_path = os.path.relpath(md_path, input_dir)
                      html_path = rel_path[:-3] + ".html"
                      target_path = os.path.join(output_dir, html_path)
                      os.makedirs(os.path.dirname(target_path), exist_ok=True)
                      html_content, success = safe_convert(md_path)
                      title = os.path.basename(file)[:-3]
                      full_html = f"""<!DOCTYPE html>
                      <html>
                      <head><meta charset="UTF-8"><title>{title}</title>
                      <style>body{{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6}}
                      h1,h2,h3{{color:#2c3e50}}a{{color:#3498db}}code{{background:#f4f4f4;padding:2px 6px;border-radius:4px}}
                      pre{{background:#f4f4f4;padding:10px;border-radius:4px;overflow-x:auto}}
                      blockquote{{border-left:4px solid #3498db;padding-left:20px;color:#555}}img{{max-width:100%}}
                      </style></head>
                      <body>{html_content}<hr><p><small>Сгенерировано из: Site/{rel_path}</small></p></body>
                      </html>"""
                      with open(target_path, 'w', encoding='utf-8') as f:
                          f.write(full_html)
                      print(f"{'✅' if success else '⚠️'} Site/{rel_path}")
          EOF

          python convert.py
          echo "✅ Конвертация завершена"

      - name: 📋 Generate index from Site folder
        run: |
          echo "📋 Генерируем индекс из папки Site..."
          cat > html_output/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>📚 Документация</title>
          <style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6}
          h1{color:#2c3e50;border-bottom:3px solid #3498db;padding-bottom:10px}
          a{color:#3498db;text-decoration:none}a:hover{text-decoration:underline}
          ul{list-style:none;padding:0}li{margin:10px 0;padding:10px;background:#f8f9fa;border-radius:8px;border-left:4px solid #3498db}
          .folder{font-weight:bold;color:#2c3e50;margin-top:20px}
          .date{color:#6c757d;text-align:center;margin-top:40px;font-size:0.8em;border-top:1px solid #dee2e6;padding-top:20px}
          </style></head><body>
          <h1>📚 Документация</h1><p>Страницы из папки <code>Site</code>:</p><ul>
          EOF

          find html_output -name "*.html" -not -name "index.html" | sort | while read file; do
            rel="${file#html_output/}"
            name="${rel%.html}"
            if [[ "$name" == *"/"* ]]; then
              folder=$(dirname "$name")
              echo "<li><span class='folder'>📁 ${folder}/</span><br><a href=\"${rel}\">${name}</a></li>" >> html_output/index.html
            else
              echo "<li><a href=\"${rel}\">${name}</a></li>" >> html_output/index.html
            fi
          done

          cat >> html_output/index.html << 'EOF'
          </ul><div class="date">Автоматическая сборка: $(date '+%Y-%m-%d %H:%M:%S')</div></body></html>
          EOF

      - name: 📦 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html_output/

  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
