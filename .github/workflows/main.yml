name: 📝 Markdown Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'Ветка_Тест1'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  markdown-processing:
    name: 🔍 Проверка и конвертация .md файлов
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: 📦 Install markdown tools
        run: |
          npm install -g markdownlint-cli
          npm install -g marked
          npm install -g prettier

      - name: 🔍 Lint Markdown files (non-fatal)
        continue-on-error: true
        run: |
          echo "🔍 Проверяем все .md файлы..."
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -print0 | xargs -0 markdownlint || true
          echo "✅ Проверка завершена (с возможными ошибками)"

      # =============== ДИАГНОСТИКА: СПИСОК ВСЕХ ФАЙЛОВ ===============
      - name: 📋 List all MD files
        run: |
          echo "📋 Найденные .md файлы:"
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -print | sort
          echo "---"

      # =============== КОНВЕРТАЦИЯ С МАКСИМАЛЬНОЙ УСТОЙЧИВОСТЬЮ ===============
      - name: 🌐 Convert MD to HTML (robust)
        run: |
          echo "🌐 Конвертируем .md в .html..."
          mkdir -p html_output
          TOTAL_FILES=0
          SUCCESS_FILES=0
          FAILED_FILES=0
          
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do
            TOTAL_FILES=$((TOTAL_FILES + 1))
            relpath=$(realpath --relative-to="." "$file" 2>/dev/null || echo "$file")
            htmlpath="${relpath%.md}.html"
            mkdir -p "html_output/$(dirname "$htmlpath")"
            
            # Пытаемся сконвертировать с игнорированием ошибок
            if marked --no-strict "$file" > "html_output/$htmlpath" 2>/dev/null; then
              echo "  ✅ Успешно: ${file}"
              SUCCESS_FILES=$((SUCCESS_FILES + 1))
            else
              echo "  ⚠️ Ошибка конвертации: ${file}, создаём заглушку"
              FAILED_FILES=$((FAILED_FILES + 1))
              cat > "html_output/$htmlpath" <<-EOF
              <!DOCTYPE html>
              <html>
              <head><meta charset="UTF-8"><title>Ошибка конвертации</title></head>
              <body>
                <h1>⚠️ Не удалось сконвертировать файл</h1>
                <p><strong>Файл:</strong> ${file}</p>
                <p><strong>Ветка:</strong> ${{ github.ref_name }}</p>
                <p>Пожалуйста, проверьте синтаксис Markdown.</p>
              </body>
              </html>
              EOF
            fi
          done
          
          echo "📊 Статистика: всего файлов $TOTAL_FILES, успешно $SUCCESS_FILES, ошибок $FAILED_FILES"
          if [ $FAILED_FILES -gt 0 ]; then
            echo "⚠️ Некоторые файлы не сконвертировались, но процесс продолжен."
          fi

      - name: 📋 Generate Markdown index with folders
        run: |
          echo "📋 Генерируем индекс с группировкой по папкам..."
          echo "# 📚 Документация проекта" > INDEX.md
          echo "" >> INDEX.md
          echo "**Ветка:** ${{ github.ref_name }}" >> INDEX.md
          echo "**Сгенерировано:** $(date '+%Y-%m-%d %H:%M:%S')" >> INDEX.md
          echo "" >> INDEX.md
          
          # Ищем папку Страницы
          if [ -d "./Страницы" ]; then
            echo "## 📁 Страницы" >> INDEX.md
            echo "" >> INDEX.md
            echo "| Файл | Описание |" >> INDEX.md
            echo "|------|----------|" >> INDEX.md
            find ./Страницы -name "*.md" -not -path "./node_modules/*" 2>/dev/null | sort | while read file; do
              clean_file="${file#./}"
              name=$(basename "$file" .md)
              echo "| [${name}](${clean_file}) | ${name} |" >> INDEX.md
            done
          else
            echo "## 📁 Папка 'Страницы' не найдена" >> INDEX.md
          fi
          
          # Другие файлы
          echo "" >> INDEX.md
          echo "## 📄 Другие файлы" >> INDEX.md
          echo "" >> INDEX.md
          echo "| Файл | Путь |" >> INDEX.md
          echo "|------|------|" >> INDEX.md
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./Страницы/*" 2>/dev/null | sort | while read file; do
            clean_file="${file#./}"
            name=$(basename "$file" .md)
            echo "| [${name}](${clean_file}) | \`${clean_file}\` |" >> INDEX.md
          done

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: markdown-output-${{ github.ref_name }}
          path: |
            *.md
            html_output/
            INDEX.md
          retention-days: 30

      - name: 📁 Prepare for deployment (all branches)
        run: |
          mkdir -p deploy_temp
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            PREFIX=""
          elif [ "${{ github.ref_name }}" == "develop" ]; then
            PREFIX="develop/"
          else
            BRANCH_NAME="${{ github.ref_name }}"
            SAFE_NAME=$(echo "$BRANCH_NAME" | sed 's/Ветка_/branch_/g' | sed 's/Тест/test/g' | tr '[:upper:]' '[:lower:]')
            PREFIX="${SAFE_NAME}/"
          fi
          
          mkdir -p "deploy_temp/$PREFIX"
          cp -r html_output/* "deploy_temp/$PREFIX"
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            cat > deploy_temp/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"><title>📚 Документация</title>
            <style>
            body{font-family:sans-serif;max-width:800px;margin:auto;padding:2rem;line-height:1.6}
            h1{color:#2c3e50}a{color:#3498db;text-decoration:none}a:hover{text-decoration:underline}
            li{margin:0.5rem 0}
            </style>
            </head>
            <body>
            <h1>📚 Документация проекта</h1>
            <p>Версии документации из разных веток:</p>
            <ul>
            <li><a href="/">Основная (main)</a></li>
            <li><a href="/develop/">Разработка (develop)</a></li>
            <li><a href="/branch_test1/">Тестовая (Ветка_Тест1)</a></li>
            </ul>
            <hr>
            <p><small>Автоматическая сборка</small></p>
            </body>
            </html>
            EOF
          fi

      - name: 🚀 Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_temp
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '📝 Деплой ветки ${{ github.ref_name }}'

  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: markdown-processing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout gh-pages
        uses: actions/checkout@v4.2.2
        with:
          ref: gh-pages
          path: gh-pages-content
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  check-links:
    name: 🔗 Проверка битых ссылок
    runs-on: ubuntu-latest
    needs: markdown-processing
    if: always() && needs.markdown-processing.result != 'cancelled'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2
      - name: 🔗 Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          folder-path: '.'
          file-path: '*.md'
          max-depth: 2
        continue-on-error: true
