name: 📝 Markdown Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'Ветка_Тест1'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  markdown-processing:
    name: 🔍 Проверка и конвертация .md файлов
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python markdown library
        run: |
          pip install markdown

      # =============== ОСНОВНОЙ ШАГ: КОНВЕРТАЦИЯ ===============
      - name: 🌐 Convert MD to HTML via Python
        id: convert
        run: |
          echo "🌐 Конвертируем .md в .html с помощью Python..."
          mkdir -p html_output
          
          cat > convert.py << 'EOF'
          import os
          import markdown
          from pathlib import Path

          input_dir = "."
          output_dir = "html_output"
          excluded_dirs = ["node_modules", ".git"]

          def safe_convert(md_path):
              try:
                  with open(md_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  html = markdown.markdown(content, extensions=['extra', 'toc'])
                  return html, True
              except Exception as e:
                  return f"<p><b>Ошибка конвертации:</b> {str(e)}</p>", False

          for root, dirs, files in os.walk(input_dir):
              dirs[:] = [d for d in dirs if d not in excluded_dirs]
              for file in files:
                  if file.endswith(".md"):
                      md_path = os.path.join(root, file)
                      rel_path = os.path.relpath(md_path, input_dir)
                      html_path = rel_path[:-3] + ".html"
                      target_path = os.path.join(output_dir, html_path)
                      os.makedirs(os.path.dirname(target_path), exist_ok=True)
                      html_content, success = safe_convert(md_path)
                      title = os.path.basename(file)[:-3]
                      full_html = f"""<!DOCTYPE html>
                      <html>
                      <head><meta charset="UTF-8"><title>{title}</title>
                      <style>body{{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6}}
                      h1,h2,h3{{color:#2c3e50}}a{{color:#3498db}}code{{background:#f4f4f4;padding:2px 6px;border-radius:4px}}
                      pre{{background:#f4f4f4;padding:10px;border-radius:4px;overflow-x:auto}}
                      blockquote{{border-left:4px solid #3498db;padding-left:20px;color:#555}}img{{max-width:100%}}
                      </style></head>
                      <body>{html_content}<hr><p><small>Сгенерировано из: {md_path}</small></p></body>
                      </html>"""
                      with open(target_path, 'w', encoding='utf-8') as f:
                          f.write(full_html)
                      status = "✅" if success else "⚠️"
                      print(f"{status} {md_path}")
          EOF

          python convert.py
          echo "✅ Конвертация завершена"

      # =============== ТОЛЬКО СОХРАНЕНИЕ АРТЕФАКТОВ ===============
      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: markdown-output-${{ github.ref_name }}
          path: |
            html_output/
          retention-days: 7

      # =============== ПОДГОТОВКА К ДЕПЛОЮ ===============
      - name: 📁 Prepare for deployment
        run: |
          mkdir -p deploy_temp
          if [ "${{ github.ref_name }}" == "main" ]; then
            PREFIX=""
          else
            BRANCH_NAME="${{ github.ref_name }}"
            SAFE_NAME=$(echo "$BRANCH_NAME" | sed 's/Ветка_/branch_/g' | sed 's/Тест/test/g' | tr '[:upper:]' '[:lower:]')
            PREFIX="${SAFE_NAME}/"
          fi
          mkdir -p "deploy_temp/$PREFIX"
          if [ -d "html_output" ]; then
            cp -r html_output/* "deploy_temp/$PREFIX" 2>/dev/null || true
          fi

      # =============== ДЕПЛОЙ ===============
      - name: 🚀 Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_temp
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '📝 Деплой ветки ${{ github.ref_name }}'

  check-links:
    name: 🔗 Проверка битых ссылок
    runs-on: ubuntu-latest
    needs: markdown-processing
    if: always() && needs.markdown-processing.result != 'cancelled'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2
      - name: 🔗 Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          folder-path: '.'
          file-path: '*.md'
          max-depth: 2
        continue-on-error: true
