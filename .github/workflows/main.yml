- name: 🌐 Convert MD to HTML (with structure)
  run: |
    echo "🌐 Конвертируем .md в .html с сохранением структуры..."
    mkdir -p html_output
    
    # Используем find с -print0 и while read для безопасной работы с именами
    find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do
      # Получаем путь относительно корня
      relpath=$(realpath --relative-to="." "$file" 2>/dev/null || echo "$file")
      # Меняем расширение на .html
      htmlpath="${relpath%.md}.html"
      # Создаём папку для HTML
      mkdir -p "html_output/$(dirname "$htmlpath")"
      
      # Конвертируем с явной обработкой ошибок
      if marked "$file" > "html_output/$htmlpath" 2>/dev/null; then
        echo "  ✅ ${file} → html_output/$htmlpath"
      else
        echo "  ⚠️ Ошибка конвертации: ${file}, создаём пустой файл"
        echo "<html><body><h1>Ошибка конвертации</h1><p>Файл: ${file}</p></body></html>" > "html_output/$htmlpath"
      fi
    done
    
    echo "✅ Конвертация завершена (с возможными ошибками)"
