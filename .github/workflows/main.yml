name: 🚀 Super CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Возможность запустить вручную из интерфейса GitHub

jobs:
  # =============== JOB 1: КАЧЕСТВО КОДА ===============
  quality:
    name: 🧐 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (пример)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint -- --max-warnings 0 # Строгий режим

      - name: 💅 Check Prettier
        run: npm run format:check

  # =============== JOB 2: СБОРКА И ТЕСТЫ ===============
  build-and-test:
    name: 🏗️ Build & Test
    needs: quality # Не запустится, пока не пройдёт линтер
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20] # Проверяем совместимость на двух версиях
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install deps
        run: npm ci

      - name: 🛠️ Build project
        run: npm run build
        env:
          CI: true # Останавливаем сборку при варнингах

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      - name: 📊 Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

      - name: 💬 Post coverage comment (для PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json'));
            const pct = coverage.total.lines.pct;
            const msg = `✅ **Coverage:** ${pct}% (Node ${{ matrix.node-version }})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg
            });

  # =============== JOB 3: АВТО-РЕЛИЗ ===============
  create-release:
    name: 🎯 Publish Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даём права на создание релиза
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно для получения всех тегов

      - name: 🏷️ Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 📦 Create ZIP archive
        run: |
          zip -r release-bundle.zip dist/ package.json README.md

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Release v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🎉 Что нового?
            - Автоматический релиз от ${{ github.sha }}
            - Прошёл все проверки CI
          draft: false
          prerelease: false
          files: release-bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Встроенный токен

  # =============== JOB 4: ОПОВЕЩЕНИЕ В TELEGRAM ===============
  notify:
    name: 📢 Telegram Notification
    if: always() # Отправим даже при падении
    needs: [quality, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: 📨 Send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🏗️ **Репозиторий:** ${{ github.repository }}
            🔥 **Статус:** ${{ job.status }}
            🌿 **Ветка:** ${{ github.ref_name }}
            👤 **Автор:** ${{ github.actor }}
            🔗 [Смотреть логи](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
