name: 📝 Markdown Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'Ветка_Тест1'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  markdown-processing:
    name: 🔍 Проверка и конвертация .md файлов
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: 📦 Install markdown tools
        run: |
          npm install -g marked
          npm install -g prettier

      # =============== ШАГ: ПРОСТОЙ СПИСОК ФАЙЛОВ ===============
      - name: 📋 List all MD files
        run: |
          echo "📋 Найденные .md файлы:"
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -print | sort

      # =============== ШАГ: КОНВЕРТАЦИЯ КАЖДОГО ФАЙЛА ОТДЕЛЬНО ===============
      - name: 🌐 Convert MD to HTML (по одному)
        run: |
          echo "🌐 Конвертируем .md в .html..."
          mkdir -p html_output
          
          # Находим все .md файлы и конвертируем по очереди
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do
            echo "  Обработка: $file"
            # Получаем путь без расширения
            relpath="${file#./}"
            relpath="${relpath%.md}"
            # Создаём папку
            mkdir -p "html_output/$(dirname "$relpath")"
            # Конвертируем, перенаправляя ошибки в отдельный файл
            if marked "$file" > "html_output/${relpath}.html" 2> "error_${relpath}.log"; then
              echo "    ✅ Успешно"
            else
              echo "    ❌ Ошибка! Создаём заглушку"
              echo "<html><body><h1>Ошибка конвертации</h1><p>$file</p></body></html>" > "html_output/${relpath}.html"
              # Выводим ошибку в лог
              cat "error_${relpath}.log" || true
            fi
            # Удаляем временный файл ошибки
            rm -f "error_${relpath}.log" 2>/dev/null || true
          done
          
          echo "✅ Конвертация завершена"

      # =============== ШАГ: СОЗДАНИЕ ПРОСТОГО ИНДЕКСА ===============
      - name: 📋 Generate simple index
        run: |
          echo "# 📚 Документация" > INDEX.md
          echo "" >> INDEX.md
          echo "**Ветка:** ${{ github.ref_name }}" >> INDEX.md
          echo "**Сгенерировано:** $(date '+%Y-%m-%d %H:%M:%S')" >> INDEX.md
          echo "" >> INDEX.md
          echo "## Файлы" >> INDEX.md
          echo "" >> INDEX.md
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" | sort | while read file; do
            clean="${file#./}"
            echo "- [$clean]($clean)" >> INDEX.md
          done

      # =============== ШАГ: СОХРАНЕНИЕ АРТЕФАКТОВ ===============
      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: markdown-output-${{ github.ref_name }}
          path: |
            *.md
            html_output/
            INDEX.md
          retention-days: 7

      # =============== ШАГ: ПОДГОТОВКА К ДЕПЛОЮ ===============
      - name: 📁 Prepare for deployment
        run: |
          mkdir -p deploy_temp
          if [ "${{ github.ref_name }}" == "main" ]; then
            PREFIX=""
          else
            # Для других веток используем имя
            BRANCH_NAME="${{ github.ref_name }}"
            SAFE_NAME=$(echo "$BRANCH_NAME" | sed 's/Ветка_/branch_/g' | sed 's/Тест/test/g' | tr '[:upper:]' '[:lower:]')
            PREFIX="${SAFE_NAME}/"
          fi
          mkdir -p "deploy_temp/$PREFIX"
          if [ -d "html_output" ]; then
            cp -r html_output/* "deploy_temp/$PREFIX" 2>/dev/null || true
          fi
          
          # Если это main, создаём index.html со ссылками
          if [ "${{ github.ref_name }}" == "main" ]; then
            cat > deploy_temp/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"><title>📚 Документация</title>
            <style>body{font-family:sans-serif;max-width:800px;margin:auto;padding:2rem;line-height:1.6}
            h1{color:#2c3e50}a{color:#3498db;text-decoration:none}
            li{margin:0.5rem 0}
            </style>
            </head>
            <body>
            <h1>📚 Документация проекта</h1>
            <p>Доступные версии:</p>
            <ul>
            <li><a href="/">Основная (main)</a></li>
            <li><a href="/develop/">Разработка (develop)</a></li>
            <li><a href="/branch_test1/">Тестовая (Ветка_Тест1)</a></li>
            </ul>
            <hr>
            <p><small>Автоматическая сборка</small></p>
            </body>
            </html>
            EOF
          fi

      # =============== ШАГ: ДЕПЛОЙ ===============
      - name: 🚀 Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_temp
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '📝 Деплой ветки ${{ github.ref_name }}'

  check-links:
    name: 🔗 Проверка битых ссылок
    runs-on: ubuntu-latest
    needs: markdown-processing
    if: always() && needs.markdown-processing.result != 'cancelled'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.2.2
      - name: 🔗 Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          folder-path: '.'
          file-path: '*.md'
          max-depth: 2
        continue-on-error: true
